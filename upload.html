<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Upload Question Paper - EngineeringHub</title>

    <link rel="stylesheet" href="style.css">

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js"></script>

</head>


<body>


    <!-- ================= NAVBAR ================= -->

    <header class="navbar">

        <div class="logo">
            🎓 Engineering<span>Hub</span>
        </div>


        <nav>

            <a href="index.html">
                Home
            </a>

            <a href="question-bank.html">
                Questions
            </a>

            <a href="index.html#ai">
                AI Solver
            </a>

            <a href="index.html#analysis">
                Analysis
            </a>

            <a href="upload.html">
                Upload
            </a>

        </nav>


        <!-- Login / Account -->

        <button
            class="login-btn"
            onclick="window.location.href='auth.html'">

            🔐 Login

        </button>

    </header>



    <!-- ================= UPLOAD SECTION ================= -->

    <main class="container">

        <h1>
            Upload Question Paper
        </h1>


        <p>
            Upload your Engineering previous-year
            question paper.
        </p>



        <!-- ================= UPLOAD FORM ================= -->

        <form id="uploadForm">


            <!-- UNIVERSITY -->

            <label>
                University / Board
            </label>

            <input
                type="text"
                id="university"
                required
            >



            <!-- BRANCH -->

            <label>
                Branch
            </label>

            <input
                type="text"
                id="branch"
                placeholder="CSE, ECE, ME, etc."
                required
            >



            <!-- SEMESTER -->

            <label>
                Semester
            </label>

            <input
                type="text"
                id="semester"
                placeholder="5th Semester"
                required
            >



            <!-- SUBJECT -->

            <label>
                Subject
            </label>

            <input
                type="text"
                id="subject"
                required
            >



            <!-- EXAM YEAR -->

            <label>
                Exam Year
            </label>

            <input
                type="number"
                id="exam_year"
                placeholder="2026"
                required
            >



            <!-- QUESTION PAPER -->

            <label>
                Question Paper
            </label>

            <input
                type="file"
                id="questionFile"
                accept=".pdf,.jpg,.jpeg,.png"
                required
            >



            <!-- DESCRIPTION -->

            <label>
                Description
            </label>

            <textarea
                id="description"
                placeholder="Any additional information..."
            ></textarea>



            <!-- SUBMIT -->

            <button type="submit">

                ⬆️ Upload Question Paper

            </button>


        </form>



        <!-- UPLOAD STATUS -->

        <p id="uploadStatus"></p>


    </main>



    <!-- ================= JAVASCRIPT ================= -->

    <script src="script.js"></script>

    <script src="upload.js"></script>


</body>

</html>
